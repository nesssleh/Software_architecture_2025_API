global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["investigation-api:8000", "order-ingest:8001"]
  - job_name: kafka
    static_configs:
      - targets: ["kafka-exporter:9308"]
  - job_name: workers          # DNS SD: находит все реплики сервиса в docker-сети
    dns_sd_configs:
      - names: ["feature-service", "scoring-service"]
        type: A
        port: 9100
    relabel_configs:
      - source_labels: [__meta_dns_name]
        target_label: service
