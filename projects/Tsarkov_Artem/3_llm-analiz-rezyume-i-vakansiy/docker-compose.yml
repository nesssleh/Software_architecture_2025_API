name: skillmatch

x-app: &app
  build: .
  image: skillmatch:latest
  environment:
    KAFKA_BOOTSTRAP: kafka:9092
    DATABASE_URL: postgresql://sm:sm@postgres:5432/skillmatch
    LLM_BASE_URL: ${LLM_BASE_URL:-}         # http://ollama:11434/v1 при запуске с --profile llm
    LLM_MODEL: qwen2.5:3b-instruct
    EMBEDDER: spacy
    METRICS_PORT: "9100"
    API_URL: http://api:8000
  depends_on:
    kafka-init: { condition: service_completed_successfully }
    postgres: { condition: service_healthy }
  restart: unless-stopped

services:
  kafka:
    image: apache/kafka:3.8.0
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 168
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 15s
      retries: 20
      start_period: 20s

  kafka-init:
    image: apache/kafka:3.8.0
    depends_on:
      kafka: { condition: service_healthy }
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        for t in documents.ingested:6 documents.processed:6 documents.ingested.dlq:1; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic $${t%%:*} --partitions $${t##*:} --replication-factor 1
        done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --describe
    restart: "no"

  kafka-exporter:                # метрики Kafka для Grafana: lag consumer groups, offset'ы топиков
    image: danielqsj/kafka-exporter:v1.8.0
    command: ["--kafka.server=kafka:9092"]
    depends_on:
      kafka-init: { condition: service_completed_successfully }
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    environment: { POSTGRES_USER: sm, POSTGRES_PASSWORD: sm, POSTGRES_DB: skillmatch }
    volumes: ["./sql/schema.sql:/docker-entrypoint-initdb.d/01.sql:ro"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U sm -d skillmatch"], interval: 5s, retries: 10 }

  ollama:                        # LLM (опционально): docker compose --profile llm up -d
    image: ollama/ollama:0.3.12
    profiles: ["llm"]
    volumes: ["ollama:/root/.ollama"]
    ports: ["11434:11434"]

  ollama-pull:
    image: ollama/ollama:0.3.12
    profiles: ["llm"]
    depends_on: [ollama]
    environment: { OLLAMA_HOST: ollama:11434 }
    entrypoint: ["/bin/sh", "-c", "sleep 5 && ollama pull qwen2.5:3b-instruct"]

  api:
    <<: *app
    command: ["sh", "-c", "rm -rf /tmp/prom && mkdir -p /tmp/prom && PROMETHEUS_MULTIPROC_DIR=/tmp/prom exec uvicorn services.api.app:app --host 0.0.0.0 --port 8000 --workers 2"]
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  extractor-worker:
    <<: *app
    command: ["python", "-m", "services.extractor_worker.worker"]
    deploy: { replicas: 2 }

  e2e:                           # e2e-тесты против живых контейнеров: docker compose --profile e2e run --rm e2e
    <<: *app
    profiles: ["e2e"]
    restart: "no"
    command: ["sh", "-c", "E2E_LIVE=1 exec python -m pytest -v -rs -p no:cacheprovider tests/e2e"]
    depends_on:
      api: { condition: service_healthy }

  prometheus:
    image: prom/prometheus:v2.53.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver      # приём метрик k6
      - --storage.tsdb.retention.time=3d
    volumes: ["./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/overview.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]

  k6:                            # нагрузочный тест: docker compose --profile load run --rm k6
    image: grafana/k6:0.54.0
    profiles: ["load"]
    environment:
      K6_PROMETHEUS_RW_SERVER_URL: http://prometheus:9090/api/v1/write
      K6_PROMETHEUS_RW_TREND_STATS: "p(50),p(95),p(99),avg,max"
      K6_PROMETHEUS_RW_PUSH_INTERVAL: 5s
      API_URL: http://api:8000
    volumes:
      - ./loadtest:/scripts:ro
      - ./evidence:/evidence
    user: "0"
    command: ["run", "-o", "experimental-prometheus-rw", "--summary-export=/evidence/k6_summary.json", "/scripts/load.js"]
    depends_on: [prometheus]

volumes:
  ollama:
